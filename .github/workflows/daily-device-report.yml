name: 📊 Daily device report

# 每天把「总人数 / 其中有型号的人数」推到钉钉。
# 同一个工作流也能被发版工作流以 workflow_call 调用：开发版发布成功、正式版发布成功后，
# 用同一套统计口径 + 同一个钉钉机器人再推一条「已发布」通知（含日统计数字）。
# 仓库是 public，凭据一律走 secrets：SUPABASE_ACCESS_TOKEN、DINGTALK_WEBHOOK，不写进文件。

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_kind:
        description: "development（开发版）| stable（正式版）| daily（日报，默认）"
        type: string
        default: "daily"
      version_name:
        description: "版本号，例如 4.3.4"
        type: string
        default: ""
      release_tag:
        description: "正式版 tag，例如 v4.3.4"
        type: string
        default: ""
      build_number:
        description: "开发版构建号（run_number）"
        type: string
        default: ""
      commit_sha:
        description: "提交号"
        type: string
        default: ""
      release_url:
        description: "发布页链接"
        type: string
        default: ""
      apk_mirror_file:
        description: "图床上的 APK 文件名（如 dev-4.3.5-b373-r1.apk，空 = 不写这一行）"
        type: string
        default: ""
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      DINGTALK_WEBHOOK:
        required: true

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 发版通知要带「这次更新了什么」，那句话只能从提交历史里来；日报没有这一步。
      - name: ⬇️ Checkout (only for a release notice)
        if: inputs.release_kind == 'development' || inputs.release_kind == 'stable'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 What changed in this release
        id: changes
        if: inputs.release_kind == 'development' || inputs.release_kind == 'stable'
        env:
          KIND: ${{ inputs.release_kind }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$KIND" = "stable" ]; then
            # 正式版要的是「这一版比上一版多了什么」：区间是「上一个 v* tag .. 本次发版的 tag」。
            # 不能拿 HEAD^ 算 —— 通知跑在发版之后，那时 master 早又往前走了，算出来的是发版之后的
            # 提交（往往只有几条 fix(ci)），真正的更新内容会被漏掉。
            END="${RELEASE_TAG:-HEAD}"
            if git rev-parse -q --verify "refs/tags/$END" >/dev/null 2>&1; then
              PREV=$(git describe --tags --abbrev=0 --match 'v*' "${END}^" 2>/dev/null || true)
              RANGE="${PREV:+$PREV..$END}"
            else
              PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
              RANGE="${PREV:+$PREV..HEAD}"
            fi
          else
            # 开发版：每次推送都发一版，最近这几条提交就是这次改的东西。
            RANGE="HEAD"
          fi
          LIST=$(git log --no-merges -n 12 --pretty=format:'%s' ${RANGE:-HEAD} 2>/dev/null \
                 | grep -vE '^(chore\(release\)|chore: 发版|Revert "|fix\(ci\)|docs\(agents\)|Merge )' \
                 | head -n 6 || true)
          if [ -z "$LIST" ]; then
            # 过滤完什么都不剩（整段都是发版/CI 提交）：退回未过滤的那几条，空着比不准确更糟。
            LIST=$(git log --no-merges -n 6 --pretty=format:'%s' ${RANGE:-HEAD} 2>/dev/null \
                   | grep -vE '^(chore\(release\)|chore: 发版|Merge )' || true)
          fi
          if [ -z "$LIST" ]; then
            LIST="（这次没有可读的提交说明，改动见发布页）"
          fi
          echo "--- changes ---"
          printf '%s\n' "$LIST"
          {
            echo 'changes<<__CHANGES__'
            printf '%s\n' "$LIST"
            echo '__CHANGES__'
          } >> "$GITHUB_OUTPUT"

      - name: Query users
        id: query
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: axuhfogeovtsbxokqccf
        run: |
          set -euo pipefail
          # 累计两个数 + 最近 7 天（含今天，按北京时间切日）每天的「新增注册 / 当天用过」。
          # 注册 = canta_users.created_at；用过 = canta_users.last_seen_at 落在当天。
          # 一个 token 一行（identity_bind 是 upsert），所以 row 数就是人数。
          SQL="select
                 count(*)::int as total,
                 count(*) filter (where model is not null and model <> '')::int as with_model,
                 (select coalesce(json_agg(json_build_object(
                            'day', to_char(g.day, 'MM-DD'),
                            'reg', coalesce(r.reg, 0),
                            'cum', coalesce(t.cum, 0),
                            'active', coalesce(a.active, 0)) order by g.day), '[]'::json)
                    from generate_series(
                           (now() at time zone 'Asia/Shanghai')::date - 6,
                           (now() at time zone 'Asia/Shanghai')::date,
                           interval '1 day') as g(day)
                    left join (
                      select (created_at at time zone 'Asia/Shanghai')::date as day, count(*) as reg
                        from canta_users
                       where created_at >= ((now() at time zone 'Asia/Shanghai')::date - 6) at time zone 'Asia/Shanghai'
                       group by 1) r on r.day = g.day::date
                    left join (
                      select (last_seen_at at time zone 'Asia/Shanghai')::date as day, count(*) as active
                        from canta_users
                       where last_seen_at >= ((now() at time zone 'Asia/Shanghai')::date - 6) at time zone 'Asia/Shanghai'
                       group by 1) a on a.day = g.day::date
                    -- 必须先按日聚成一天一行，再开窗求累计。直接 count(*) over (order by 日期)
                    -- 是在 canta_users 的每一行上开窗，一天有 N 个用户就有 N 行，join 回去
                    -- 会把 7 天放大成几千行（钉钉正文被撑爆、job 直接起不来）。
                    left join (
                      select day, sum(reg) over (order by day) as cum
                        from (select (created_at at time zone 'Asia/Shanghai')::date as day,
                                     count(*) as reg
                                from canta_users
                               group by 1) per_day) t on t.day = g.day::date
                 ) as days
               from canta_users"
          RESPONSE=$(curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$SQL" '{query: $q}')")
          echo "$RESPONSE"
          TOTAL=$(echo "$RESPONSE" | jq -r '.[0].total')
          WITH_MODEL=$(echo "$RESPONSE" | jq -r '.[0].with_model')
          # A malformed answer must fail the job instead of pushing "null" to the group.
          case "$TOTAL" in ''|null) echo "no total in response" >&2; exit 1;; esac
          case "$WITH_MODEL" in ''|null) echo "no with_model in response" >&2; exit 1;; esac
          # 7 日表：每行「MM-DD：注册 +N ｜ 累计 M ｜ 用过 K」。
          # 必须是 jq 一次成串（内部 join("\n")），不能写成两段管道再靠 sed 逐行加前缀：
          # GitHub 解析输出文件时每一行都要起一个进程，7 行还能过，30 天就 30 次，
          # 实际踩过「Argument list too long」，整个 job 在 Push to DingTalk 那步直接起不来。
          DAYS=$(printf '%s' "$RESPONSE" | jq -r '
            [(.[0].days // [])[]
             | (.day + "：注册 +" + (.reg | tostring)
                + " ｜ 累计 " + (.cum | tostring)
                + " ｜ 用过 " + (.active | tostring))]
            | map("- " + .) | join("\n")')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "with_model=$WITH_MODEL" >> "$GITHUB_OUTPUT"
          # 多行 output 用定界符包起来；空表时不写（省得正文里冒出空的「最近 7 日」）。
          if [ -n "$DAYS" ]; then
            {
              echo 'days<<__DAYS__'
              printf '%s\n' "$DAYS"
              echo '__DAYS__'
            } >> "$GITHUB_OUTPUT"
          fi

      # 通知跑在「🌐 Deploy download page」之后，但 GitHub Pages 的 CDN 还会慢几十秒。
      # 这里等下载页真的报出这一版再发：通知里的链接点开必须是这一版，不是上一版。
      - name: ⏳ Make sure the download page already serves this release
        if: inputs.release_kind == 'development' || inputs.release_kind == 'stable'
        env:
          KIND: ${{ inputs.release_kind }}
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          if [ "$KIND" = "development" ]; then
            FILE="https://303562915.github.io/unicanta/development.json"
            WANT="$BUILD_NUMBER"
            PICK='.build_number // ""'
          else
            FILE="https://303562915.github.io/unicanta/latest.json"
            WANT="$VERSION_NAME"
            PICK='.version_name // ""'
          fi
          for i in $(seq 1 8); do
            GOT=$(curl -sS --max-time 15 -H 'Cache-Control: no-cache' "$FILE?t=$(date +%s)-$i" 2>/dev/null \
                  | jq -r "$PICK" 2>/dev/null || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "下载页已经是这一版（$GOT）"
              exit 0
            fi
            echo "第 $i/8 次：下载页还是 ${GOT:-空}，等 15 秒"
            sleep 15
          done
          echo "::error::下载页 2 分钟内没有更新到 ${WANT}，这条通知不发 —— 先看 🌐 Deploy download page 那次 run。"
          exit 1

      - name: Push to DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          TOTAL: ${{ steps.query.outputs.total }}
          WITH_MODEL: ${{ steps.query.outputs.with_model }}
          DAYS: ${{ steps.query.outputs.days }}
          KIND: ${{ inputs.release_kind }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          HEAD_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_URL: ${{ inputs.release_url }}
          APK_MIRROR_FILE: ${{ inputs.apk_mirror_file }}
          CHANGES: ${{ steps.changes.outputs.changes }}
        run: |
          set -euo pipefail
          STAMP=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          # 发布页链接：调用方不再传完整 URL（含仓库名，过不了 job output 的 secret 过滤），
          # 这里按通道自己拼。
          if [ -z "${RELEASE_URL:-}" ]; then
            if [ "$KIND" = "development" ]; then
              RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/dev"
            elif [ -n "${RELEASE_TAG:-}" ]; then
              RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            fi
          fi
          # 图床直链在这里拼：完整 URL 含项目名，过不了 job output（会被当成 secret 丢掉），
          # 所以发版工作流只传文件名，根地址和目录固定写在下面（与 ImageBed.kt 的 BASE_URL / ROOT 一致）。
          APK_URL=""
          if [ -n "${APK_MIRROR_FILE:-}" ]; then
            APK_URL="https://cloudflare-imgbed-erh.pages.dev/file/unicanta/apk/${APK_MIRROR_FILE}"
          fi
          case "${KIND:-daily}" in
            development) TITLE="unicanta 开发版已发布"; CHANNEL="开发版（dev）" ;;
            stable)      TITLE="unicanta 正式版已发布"; CHANNEL="正式版（${RELEASE_TAG}）" ;;
            *)           TITLE="unicanta 用户日报";     CHANNEL="日报" ;;
          esac
          BODY=$(jq -n \
            --arg title "$TITLE" \
            --arg stamp "$STAMP" \
            --arg total "$TOTAL" \
            --arg model "$WITH_MODEL" \
            --arg days "${DAYS:-}" \
            --arg channel "$CHANNEL" \
            --arg ver "$VERSION_NAME" \
            --arg build "$BUILD_NUMBER" \
            --arg commit "$HEAD_COMMIT" \
            --arg url "$RELEASE_URL" \
            --arg apk "$APK_URL" \
            --arg changes "${CHANGES:-}" '
            def short($n): if (($n // "") | length) > 7 then ($n[0:7]) else ($n // "") end;
            def line($k; $v): if (($v // "") == "") then "" else "- " + $k + "：" + $v + "\n" end;
            # 图床直链做成可点的：钉钉的 markdown 里裸 URL 不一定认。
            def apkline($v): if (($v // "") == "") then "" else "- APK 直链（图床）：[" + $v + "](" + $v + ")\n" end;
            # 版本、构建号、提交挤成一行：一条通知里占三行只是噪音，读的人要的是「几版的、哪次提交」。
            # 日报没有这三样，那时整行不出现。
            def versionline($ver; $build; $commit):
              (if ($ver // "") == "" then "" else ("版本 " + $ver) end) as $v
              | (if ($build // "") == "" then "" else (" · build " + $build) end) as $b
              | (if ($commit // "") == "" then "" else (" · 提交 " + short($commit)) end) as $c
              | if ($v + $b + $c) == "" then "" else ("- " + $v + $b + $c + "\n") end;
            # 「这次更新了什么」——发版通知最容易缺、也最该在的那一段。
            def changelog($c):
              ($c | split("\n") | map(select((. | length) > 0)) | map("- " + .) | join("\n")) as $lines
              | if $lines == "" then "" else "\n本次更新：\n" + $lines + "\n\n" end;
            # 最近 7 日：每天新增注册 + 当天用过的人数，发版通知和日报都带。
            def daily($d):
              ($d | split("\n") | map(select((. | length) > 0)) | join("\n")) as $lines
              | if $lines == "" then "" else ("\n最近 7 日：\n" + $lines + "\n\n") end;
            {
              msgtype: "markdown",
              markdown: {
                title: $title,
                text: ("### " + $title + "\n\n" +
                       "- 时间：" + $stamp + "\n" +
                       "- 通道：" + $channel + "\n" +
                       versionline($ver; $build; $commit) +
                       changelog($changes) +
                       line("发布页"; $url) +
                       "- 图床下载页：https://cloudflare-imgbed-erh.pages.dev/file/unicanta/download/index.html\n" +
                       apkline($apk) +
                       daily($days) +
                       "- 总人数：" + $total + "\n" +
                       "- 有型号：" + $model + "\n\n" +
                       "rr")
              }
            }')
          ANSWER=$(curl -sS --fail-with-body -X POST "$DINGTALK_WEBHOOK" \
            -H 'Content-Type: application/json' -d "$BODY")
          echo "$ANSWER"
          # DingTalk answers HTTP 200 with errcode != 0 when the keyword or the webhook is wrong.
          echo "$ANSWER" | jq -e '.errcode == 0' > /dev/null
