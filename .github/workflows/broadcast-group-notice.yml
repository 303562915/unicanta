name: 📣 Broadcast group notice (one-shot)

# 一次性：把 4.3.5 发布通知以「群聊AI」的身份发到内测灰度群，然后删掉这个文件。
# 为什么不用本机跑：本机到 supabase 的网络被 reset，CI 里同样的 Management API 是通的。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List groups
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: axuhfogeovtsbxokqccf
        run: |
          set -euo pipefail
          SQL="select c.id, c.title, (select count(*) from public.conversation_members m where m.conversation_id = c.id) as members from public.conversations c where c.kind = 'group' order by c.id"
          curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$SQL" '{query: $q}')"

      - name: Post the notice
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: axuhfogeovtsbxokqccf
        run: |
          set -euo pipefail
          printf '%s\n' \
            "📢 UniCanta 新版本已发布" \
            "" \
            "正式版 4.3.5（version_code 244）已上线，开发版 dev 也已同步到同一个提交。" \
            "" \
            "下载页（点开用浏览器下载）：" \
            "https://303562915.github.io/unicanta/" \
            "" \
            "正式版 APK 直链：" \
            "https://github.com/303562915/unicanta/releases/download/v4.3.5/androidApp-release.apk" \
            "" \
            "SHA-256 校验和：" \
            "https://github.com/303562915/unicanta/releases/download/v4.3.5/SHA256SUMS.txt" \
            "" \
            "覆盖安装即可，签名与旧版一致；如果是从 F-Droid 装的那份，先卸载再装。" \
            > body.txt
          BODY=$(cat body.txt)
          SQL="with g as (
                 select c.id from public.conversations c
                  where c.kind = 'group'
                    and (c.title ilike '%内测%' or c.title ilike '%灰度%' or c.title ilike '%内部%')
                  order by c.last_message_at desc
                  limit 1
               ), ins as (
                 insert into public.messages (conversation_id, sender, sender_name, body, kind)
                 select g.id, 'ai', '群聊AI', \$body\$$BODY\$body\$, 'text' from g
                 returning id, conversation_id, created_at
               ), upd as (
                 update public.conversations c set last_message_at = ins.created_at
                   from ins where c.id = ins.conversation_id
                 returning c.id, c.title
               )
               select upd.id as conversation_id, upd.title as title, ins.id as message_id, ins.created_at
                 from upd join ins on ins.conversation_id = upd.id"
          RESP=$(curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$SQL" '{query: $q}')")
          echo "$RESP"
          COUNT=$(echo "$RESP" | jq 'length')
          test "$COUNT" -ge 1 || { echo "no group matched 内测/灰度/内部 — nothing was posted" >&2; exit 1; }
