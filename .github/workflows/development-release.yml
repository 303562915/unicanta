name: 🧪 Development APK

on:
  push:
    branches:
      - master

concurrency:
  group: development-release-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish signed development APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # published 只有真的把 dev prerelease 更新掉之后才是 true（跳过发布时为空），
    # 钉钉通知 job 靠它判断「已经成功发布到新开发版本」。
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version_name: ${{ steps.publish.outputs.version_name }}
      # 图床上这份 APK 的文件名（含构建号）与是否传成功。**不能在这里传完整直链**：
      # 直链里有 `unicanta`，而仓库某个 secret 的值是它的子串，GitHub 会以
      # "may contain secret" 为由把含该子串的 job output 静默丢掉（logs 里是
      # `Skip output '...' since it may contain secret`），下游拿到的就是空串。
      # 所以直链由下游用这里传出的文件名自己拼（图床根地址在那边硬编码）。
      apk_mirror_file: ${{ steps.imagebed.outputs.file }}
      apk_mirror_ok: ${{ steps.imagebed.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.CANTA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "CANTA_KEYSTORE_BASE64 is required" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is required" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is required" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is required" >&2; exit 1; }

      - name: Write signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.CANTA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/key.properties"

      - name: Build signed release APK
        env:
          CANTA_DEVELOPMENT_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --stacktrace --no-daemon

      - name: Prepare APK and checksums
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/*.apk "dist/androidApp-release-${RUN_NUMBER}.apk"
          cd dist
          sha256sum "androidApp-release-${RUN_NUMBER}.apk" > "SHA256SUMS-${RUN_NUMBER}.txt"

      - name: Skip publication if this is no longer master HEAD
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin master
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
            echo "is_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_head=false" >> "$GITHUB_OUTPUT"
            echo "A newer master commit exists; skipping this publication."
          fi

      - name: Publish rolling prerelease
        id: publish
        if: steps.current.outputs.is_head == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^version_name=//p' gradle.properties)
          test -n "$VERSION_NAME" || { echo "version_name is missing from gradle.properties" >&2; exit 1; }
          test "$(printf '%s\n' "$VERSION_NAME" | wc -l)" -eq 1 || { echo "version_name must be unique in gradle.properties" >&2; exit 1; }
          printf 'Development build\n\nversion: %s\ndevelopment-build: %s\n\nCommit: %s\n\nSigned with the same release key as stable APKs.\n' \
            "$VERSION_NAME" "$RUN_NUMBER" "$COMMIT" > RELEASE_NOTES.md
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev \
              --target "$COMMIT" \
              --title "Canta development builds" \
              --notes "Preparing the first development build." \
              --prerelease
          fi
          # --clobber: re-running this workflow for the same run number produces the same
          # asset names, and without it the upload fails instead of replacing them.
          gh release upload dev \
            "dist/androidApp-release-${RUN_NUMBER}.apk" \
            "dist/SHA256SUMS-${RUN_NUMBER}.txt" \
            --clobber
          gh release edit dev \
            --title "Canta development build $RUN_NUMBER" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Mirror APK to the image bed
        id: imagebed
        # 只镜像真正发布出去的那一份（条件与上面同一个），而且失败不阻断发布：
        # 图床只是国内下载更快的镜像，GitHub releases 上的直链才是权威产物。
        if: steps.current.outputs.is_head == 'true'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -uo pipefail
          # 地址、Token、根目录都不在 workflow 里另抄一份：直接读客户端里那份常量（ImageBed.kt），
          # 以后换图床/换 Token/改目录只改一处。
          SRC=composeApp/src/commonMain/kotlin/io/github/samolego/canta/data/imagebed/ImageBed.kt
          BASE_URL=$(sed -n 's/.*const val BASE_URL = "\([^"]*\)".*/\1/p' "$SRC")
          TOKEN=$(sed -n 's/.*const val TOKEN = "\([^"]*\)".*/\1/p' "$SRC")
          ROOT_DIR=$(sed -n 's/.*const val ROOT = "\([^"]*\)".*/\1/p' "$SRC")
          if [ -z "$BASE_URL" ] || [ -z "$TOKEN" ] || [ -z "$ROOT_DIR" ]; then
            echo "::warning::image bed mirror skipped: BASE_URL / TOKEN / ROOT not found"
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          APK="dist/androidApp-release-${RUN_NUMBER}.apk"
          # 目录固定 <项目根>/apk：安装包单独一层，和头像（unicanta/头像）、群聊图（unicanta/群聊）分开。
          FOLDER="${ROOT_DIR}/apk"
          # 固定文件名 + overwrite=1：图床上永远只留这一份，新包直接替换旧包（旧 APK 等于自动删除）。
          # 名字刻意不带版本号，图床重名会 409，靠 overwrite 才能顶掉上一份；也不带项目名前缀，
          # 因为它要通过 job output 传给下游，含 `canta` 子串会被 GitHub 当成 secret 丢掉。
          NAME="latest.apk"
          RESP=$(curl -sS --fail-with-body --max-time 600 -X POST "$BASE_URL/api/upload" \
            -F "file=@${APK};type=application/vnd.android.package-archive;filename=${NAME}" \
            -F "uid=${TOKEN}" \
            -F "fileName=${NAME}" \
            -F "folder=${FOLDER}" \
            -F "overwrite=1" || true)
          echo "$RESP"
          URL=$(printf '%s' "$RESP" | jq -r '.url // empty' 2>/dev/null)
          if [ -z "$URL" ]; then
            echo "::warning::image bed mirror failed for $APK — the notice will carry the GitHub link only"
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 当场回读一次：图床收下了但读不出来，等于没镜像。
          if curl -sS -o /dev/null --fail --max-time 180 "$URL"; then
            echo "mirrored: $URL"
            echo "file=$NAME" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::image bed URL is not readable: $URL"
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  notify:
    name: 📣 DingTalk notice (development release)
    # 触发条件：开发版已经成功发布（notify 只在 really published 时跑，跳过的发布不推消息）。
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/daily-device-report.yml
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
    with:
      release_kind: development
      version_name: ${{ needs.publish.outputs.version_name }}
      build_number: ${{ github.run_number }}
      commit_sha: ${{ github.sha }}
      release_url: https://github.com/303562915/unicanta/releases/tag/dev
      apk_mirror_file: ${{ needs.publish.outputs.apk_mirror_ok == 'true' && needs.publish.outputs.apk_mirror_file || '' }}

  notify-group:
    name: 📣 Group notice (development release)
    # 和上面那条钉钉同一个触发点：开发版真的发布了，才让「群聊AI」在灰度群里发一条。
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/group-release-notice.yml
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    with:
      release_kind: development
      version_name: ${{ needs.publish.outputs.version_name }}
      build_number: ${{ github.run_number }}
      commit_sha: ${{ github.sha }}
      apk_url: https://github.com/303562915/unicanta/releases/download/dev/androidApp-release-${{ github.run_number }}.apk
      apk_mirror_file: ${{ needs.publish.outputs.apk_mirror_ok == 'true' && needs.publish.outputs.apk_mirror_file || '' }}
      sums_url: https://github.com/303562915/unicanta/releases/download/dev/SHA256SUMS-${{ github.run_number }}.txt
