name: 🩺 Backend watchdog

# 后端自愈巡检：每 10 分钟摸一次数据库，连不上就自动重启项目并通知钉钉。
#
# 为什么要有它：2026-11-24 那次事故是 Supabase 实例的存储层劣化（checkpoint 每次写盘
# 30–53 秒），两小时后把连接池拖死，PostgREST 对所有请求返 5xx。当时只能等人工发现、
# 人工重启。这个 job 把那段人工动作变成自动的：
#
#   1. 连续 4 次 `select 1` 都失败 → 认定数据库不可用（单次超时、冷启动抖动不算）
#   2. 调管理 API 重启项目，然后每 20 秒探一次，直到 ACTIVE_HEALTHY 且查询能过
#   3. 往钉钉发一条：自动恢复完成 / 需要人工处理
#
# 2026-11-26 改：checkpoint 慢**也重启**，不再只是发预警。
#
#   以前 `disk slow=yes` 只推一条钉钉就结束 —— 用户的原话是「你通知我有什么用？你通知我，我也
#   没办法解决」。预警只有在能附上一个已经做完的动作时才有意义，所以现在：
#     checkpoint write= > 120s  →  直接重启，然后发「已自动重启」的钉钉
#
#   **阈值是 120s，不是 30s。** 同一天先按 30s 上线过，被实测数据否掉了：重启后 checkpoint
#   稳定回到 60–85 秒，于是变成每 30 分钟重启一次的死循环（当天 14 次），而那种幅度是 Nano 档
#   磁盘突发余额 0% 的物理极限 —— 重启一秒也换不回来。现在只在这一天真越过历史最差值时才打断，
#   把「每半小时必断 4 分钟」换成「慢但不停」。细节见 Check disk latency 那步的注释。
#
# 粒度说明，以及 2026-11-25 的教训（重要）：
#
#   这个 job 在 11-25 凌晨那次 4 小时故障里**一次都没被调度**——23:34Z 跑完最后一次，
#   之后近 5 小时没有任何 run（`gh run list -w backend-watchdog.yml` 可查）。
#   GitHub 官方对 schedule 的说明里有两条正好命中：
#     * 高峰期（尤其整点）会延迟，负载够高时**队列里的 job 会被直接丢掉**；
#     * 去掉 5 的倍数这类高频写法容易被削峰。
#
#   所以：**GitHub cron 不能当唯一的可靠性保障**。这里改成每 20 分钟（避开整点）、
#   探测超时收紧到 15 秒（对「慢」更敏感），但真相是——它只能尽力而为。
#   故障真的不能再发生，只能靠实例本身的 IO 基线（见 README/事故记录：Micro 档 500 IOPS）。

on:
  schedule:
    # 每 20 分钟，避开整点（整点是 GitHub 负载最高的时候，最容易被丢）
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    name: 🩺 db health
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DING: ${{ secrets.DINGTALK_WEBHOOK }}
      REF: axuhfogeovtsbxokqccf
    steps:
      - name: Probe database
        id: probe
        run: |
          set -uo pipefail
          # 超时 15 秒（不是 25）：这台实例在故障期就是「能连上但每条查询等 8 秒以上超时」，
          # 放宽超时只会让探测自己也被拖住，反而看不出问题。
          for i in 1 2 3 4; do
            t0=$(date +%s)
            code=$(curl -sS -m 15 -o /tmp/q.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"query":"select 1 as ok"}' || echo 000)
            dur=$(( $(date +%s) - t0 ))
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              echo "第 $i 次探测：OK (HTTP $code, ${dur}s)"
              # 单条 select 1 都要 10 秒以上，说明连接池已经在被慢查询拖住，没必要等它彻底挂。
              if [ "$dur" -ge 10 ]; then
                echo "state=slow" >> "$GITHUB_OUTPUT"
              else
                echo "state=ok" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            echo "第 $i 次探测：HTTP $code (${dur}s) — $(head -c 200 /tmp/q.json 2>/dev/null)"
            sleep 8
          done
          echo "state=down" >> "$GITHUB_OUTPUT"
          echo "### 🚨 数据库连续 4 次探测失败 ($(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"

      - name: Restart project and wait for recovery
        id: restart
        if: steps.probe.outputs.state == 'down' || steps.probe.outputs.state == 'slow'
        run: |
          # 关键：关掉 errexit（GitHub 的 bash 默认 -e）。重启期间
          # `GET /projects/$REF` 返回的不是 JSON，jq 非零退出会把整个 job 杀掉 ——
          # 那样重启发出去了却没人等它恢复、也没人发钉钉（2026-11-26 16:00 就是这么卡的）。
          set +e -uo pipefail
          start=$(date +%s)
          code=$(curl -sS -m 90 -o /tmp/r.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$REF/restart" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{}' || true)
          echo "restart 请求：HTTP ${code:-000}"

          for i in $(seq 1 30); do
            sleep 15
            body=$(curl -sS -m 20 -H "Authorization: Bearer $TOKEN" \
              "https://api.supabase.com/v1/projects/$REF" 2>/dev/null || true)
            status=$(printf '%s' "$body" | jq -r '.status // "?"' 2>/dev/null || true)
            [ -n "${status:-}" ] || status="?"
            qcode=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"query":"select 1"}' 2>/dev/null || true)
            [ -n "${qcode:-}" ] || qcode="000"
            echo "第 $i 次：status=$status query=$qcode"
            if [ "$status" = "ACTIVE_HEALTHY" ] && { [ "$qcode" = "200" ] || [ "$qcode" = "201" ]; }; then
              took=$(( $(date +%s) - start ))
              echo "recovered=yes" >> "$GITHUB_OUTPUT"
              echo "took=${took}s" >> "$GITHUB_OUTPUT"
              echo "### ✅ 自动重启成功，用时 ${took}s" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "recovered=no" >> "$GITHUB_OUTPUT"
          echo "### ❌ 自动重启后仍未恢复" >> "$GITHUB_STEP_SUMMARY"

      - name: Check disk latency
        id: disk
        if: steps.probe.outputs.state == 'ok'
        run: |
          set -uo pipefail
          # 这次事故的真正起点：checkpoint 每次写盘要 30–148 秒（正常是毫秒级）。
          # 它在服务还能用的时候就出现了，所以这里当作早期信号。
          #
          # 两条线，别混：
          #   > 5s   记进 summary，当作「正在恶化」的可观察事实，不打扰任何人；
          #   > 120s 才算「已经进入必挂区间」，触发重启（见下面 restart-slow-disk 那步）。
          #
          # **2026-11-26 把重启线从 30s 提到 120s。** 原来定 30s 时以为这是偶发劣化，
          # 重启一次就好；实测一整天的数据否掉这个假设：每次重启后 checkpoint 稳定回到
          # 60–85 秒（14 次：60/63/64/65/66/67/68/70/71/71/73/76/84/85），于是**每 30 分钟
          # 重启一次，循环不止**。Supabase 支持确认根因是「磁盘突发余额 0%、swap 涨到 557 MB
          # 而实例只有 426 MB」—— 那是 Nano 档的物理极限，重启换不来哪怕一秒的改善。
          #
          # 那么重启就只剩坏处：每次约 4 分钟不可用，还打断了正在跑的请求。60–85 秒虽然慢，
          # 服务是**能用**的。所以把线提到 120s：只在这一天真的越过历史最差值时才打断它，
          # 把「每半小时必断 4 分钟」换成「慢但不停」。
          #
          # 真正该做的事在客户端侧（降请求量）和实例档位（升 Micro），不是这里。
          end=$(date -u +%Y-%m-%dT%H:%M:00Z)
          start=$(date -u -d '-15 minutes' +%Y-%m-%dT%H:%M:00Z)
          sql="select event_message from logs where source='postgres_logs' and event_message like '%checkpoint complete%' order by timestamp desc limit 5"
          payload=$(jq -n --arg s "$sql" --arg a "$start" --arg b "$end" \
            '{sql:$s,iso_timestamp_start:$a,iso_timestamp_end:$b}')
          resp=$(curl -sS -m 60 -X POST \
            "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$payload" || echo '{}')
          worst=$(echo "$resp" | jq -r '[.result[]?.event_message | capture("write=(?<w>[0-9.]+) s").w | tonumber] | max // 0' 2>/dev/null || echo 0)
          echo "最近 15 分钟 checkpoint 最慢一次：${worst}s"
          echo "worst=${worst}" >> "$GITHUB_OUTPUT"
          if awk "BEGIN{exit !(${worst:-0} > 120)}"; then
            echo "critical=yes" >> "$GITHUB_OUTPUT"
            echo "### 🔥 存储已到必挂区间：checkpoint write=${worst}s → 将自动重启" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "critical=no" >> "$GITHUB_OUTPUT"
            if awk "BEGIN{exit !(${worst:-0} > 5)}"; then
              echo "### ⚠️ 存储变慢（观察中，未达重启线 120s）：checkpoint write=${worst}s" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Restart for slow disk
        id: restart-disk
        if: steps.disk.outputs.critical == 'yes'
        run: |
          # GitHub 的 `shell: bash -e` 默认开着 -e（errexit）。实例重启期间
          # `GET /projects/$REF` 返回的不是 JSON（是 HTML 或空），`jq` 会非零退出，
          # `-e` 于是**立刻杀掉整个 job** —— 2026-11-26 16:00 那次就是这样：重启发出去了
          # （HTTP 200），但等待循环一次都没跑、钉钉也没发，实例停在 RESTARTING 没人管。
          # 所以这里显式关掉 errexit，并给每一条探测单独兜底：这一层的错误全都只表示
          # 「还没好，继续等」，不该让 job 失败。
          set +e -uo pipefail
          start=$(date +%s)
          code=$(curl -sS -m 90 -o /tmp/rd.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$REF/restart" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{}' || echo 000)
          echo "restart 请求：HTTP ${code:-000}"

          for i in $(seq 1 30); do
            sleep 15
            # 拿不到 JSON（重启中）时 status 记成 "?"，jq 的失败用 || true 吞掉；
            # 命令替换里的失败也不会因为 pipefail 冒出去。
            body=$(curl -sS -m 20 -H "Authorization: Bearer $TOKEN" \
              "https://api.supabase.com/v1/projects/$REF" 2>/dev/null || true)
            status=$(printf '%s' "$body" | jq -r '.status // "?"' 2>/dev/null || true)
            [ -n "${status:-}" ] || status="?"
            qcode=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"query":"select 1"}' 2>/dev/null || true)
            [ -n "${qcode:-}" ] || qcode="000"
            echo "第 $i 次：status=$status query=$qcode"
            if [ "$status" = "ACTIVE_HEALTHY" ] && { [ "$qcode" = "200" ] || [ "$qcode" = "201" ]; }; then
              took=$(( $(date +%s) - start ))
              echo "recovered=yes" >> "$GITHUB_OUTPUT"
              echo "took=${took}s" >> "$GITHUB_OUTPUT"
              echo "### ✅ 因 checkpoint 变慢自动重启，用时 ${took}s" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "recovered=no" >> "$GITHUB_OUTPUT"
          echo "### ❌ 因 checkpoint 变慢重启后仍未恢复" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify DingTalk (slow disk restart)
        if: always() && steps.disk.outputs.critical == 'yes'
        env:
          RECOVERED: ${{ steps.restart-disk.outputs.recovered }}
          TOOK: ${{ steps.restart-disk.outputs.took }}
          WORST: ${{ steps.disk.outputs.worst }}
        run: |
          set -uo pipefail
          stamp=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          # 只有「已经做过动作」才发钉钉。发一条只有预警、没有动作的消息对用户毫无价值
          # （原话：「你通知我，我也没办法解决」）。
          if [ "${RECOVERED:-}" = "yes" ]; then
            title="unicanta 后端已自动重启（checkpoint 变慢）"
            line="- 处理：已自动重启项目，用时 ${TOOK:-?}，服务已恢复"
          else
            title="unicanta 后端重启后仍未恢复，需要人工处理"
            line="- 处理：自动重启后 8 分钟内仍未恢复 —— **这次真的要你看一眼**"
          fi
          payload=$(jq -n --arg t "$title" --arg s "$stamp" --arg r "$REF" --arg l "$line" --arg w "${WORST:-?}" \
            '{msgtype:"markdown",markdown:{title:$t,text:("### "+$t+"\n\n- 时间："+$s+"\n- 项目："+$r+"\n- 触发原因：checkpoint 写盘 "+$w+"s（已进入必挂区间）\n"+$l+"\n\nrr")}}')
          resp=$(curl -sS -m 20 -X POST "$DING" -H 'Content-Type: application/json' -d "$payload" || echo '{"errcode":"curl-failed"}')
          echo "钉钉返回：$resp"
          echo "$resp" | grep -q '"errcode":0' || echo "::warning::钉钉没有接受这条消息（检查机器人关键词/签名）"

      - name: Notify DingTalk
        if: always() && (steps.probe.outputs.state == 'down' || steps.probe.outputs.state == 'slow')
        env:
          RECOVERED: ${{ steps.restart.outputs.recovered }}
          TOOK: ${{ steps.restart.outputs.took }}
        run: |
          set -uo pipefail
          stamp=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          if [ "${RECOVERED:-}" = "yes" ]; then
            title="unicanta 后端故障已自动恢复"
            line="- 处理：已自动重启项目，用时 ${TOOK:-?}"
          else
            title="unicanta 后端不可用，需要人工处理"
            line="- 处理：自动重启后 8 分钟内仍未恢复"
          fi
          payload=$(jq -n --arg t "$title" --arg s "$stamp" --arg r "$REF" --arg l "$line" \
            '{msgtype:"markdown",markdown:{title:$t,text:("### "+$t+"\n\n- 时间："+$s+"\n- 项目："+$r+"\n"+$l+"\n- 现象：数据库连续 4 次探测失败，或单条 select 1 已慢到 10 秒以上（App 会看到所有社区页面空着）\n\nrr")}}')
          resp=$(curl -sS -m 20 -X POST "$DING" -H 'Content-Type: application/json' -d "$payload" || echo '{"errcode":"curl-failed"}')
          echo "钉钉返回：$resp"
          echo "$resp" | grep -q '"errcode":0' || echo "::warning::钉钉没有接受这条消息（检查机器人关键词/签名）"
