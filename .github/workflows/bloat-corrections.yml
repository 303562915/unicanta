name: 🛠️ Bloat corrections

# 把「级别修正」合并进 `site/bloat/level_fixes.json`，之后手机从这份静态文件读到新级别。
#
# 两条来源，一个出口：
#   1. **应用里提的提案 + 投票**（主路径）：客户端调 `level_fix_add` / `level_fix_vote` 写库，
#      票数够了后端把那条标成 applied；本工作流把 applied 但还没下发的取出来合并进 JSON。
#   2. **issue 表单**（兜底）：维护者核实后打 `level-fix-confirm` 标签，同样合并进 JSON。
#
# 约束（别改成"客户端直连数据库"）：修正表是**静态文件**。数据库那一侧是按请求数撑着的（Free 档
# 426 MB，2026-11-25 三次全站白屏就是请求量压垮的，见 ops-notes/backend-incident-2026-11-25.md），
# 一张几十行的表不值得让每台手机每天都去问一次。
#
# 文件里两类条目：`source = maintainer`（我们自己确认过写下的）与 `source = community`。
# 工作流**只写 community 那部分**，maintainer 的条目一个字都不改。

on:
  schedule:
    # 每天一次：投票通过之后最多一天就落到文件里，手机下一次核对（一周内）取到。
    - cron: "23 */6 * * *"
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "要走 issue 通道合并的 issue 编号（留空 = 只跑数据库那条腿）"
        required: false
        type: string
      dry_run:
        description: "只校验不提交"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: bloat-corrections
  cancel-in-progress: false

env:
  TARGET: site/bloat/level_fixes.json
  LIST: site/bloat/bloat_list.json

jobs:
  merge:
    if: |
      github.event_name != 'issues' ||
      github.event.label.name == 'level-fix-confirm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      # ---------------------------------------------------------------- 数据库那条腿
      # 用 Management API 跑一条 select，和 apply-sql.yml / auto-join-official-groups.yml 同一条路子：
      # 仓库里只有 SUPABASE_ACCESS_TOKEN，没有 service key，也不该为了这一次查询多发一把长期密钥。
      - name: 🗳️ Fetch approved votes from the backend
        id: votes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: axuhfogeovtsbxokqccf
        run: |
          set -euo pipefail
          # level_fix_pending()：已通过、还没下发的几条，形状就是 level_fixes.json 的一条。
          # 函数不存在（迁移还没推）时返回空数组，不是错误 —— 这时按"没有投票结果"跳过。
          SQL="select coalesce(public.level_fix_pending(), '[]'::jsonb) as rows"
          set +e
          RESP=$(jq -Rs '{query: .}' <<< "$SQL" | curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @- 2>&1)
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            echo "::warning::查 level_fix_pending() 失败（多半是迁移还没推），本轮只走 issue 那条腿：$RESP"
            echo "rows=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "--- pending ---"
          echo "$RESP"
          # Management API 回的是 [{rows: ...}]：把 rows 摘出来，形状对齐 level_fixes.json 的条目。
          ROWS=$(echo "$RESP" | jq -c '[.[0].rows[]? | {id: .id, pkg: .pkg, removal: .removal, notes: .notes}]')
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- issue 那条腿
      - name: 📥 Read the issue (if any)
        id: read
        if: github.event.issue.number || inputs.issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" > /tmp/issue.json
          jq -r '.body // ""' /tmp/issue.json > /tmp/body.txt
          echo "--- body ---"
          cat /tmp/body.txt

      - name: 🧾 Parse the issue form
        id: parse
        if: github.event.issue.number || inputs.issue
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, sys

          body = open('/tmp/body.txt', encoding='utf-8').read()
          allowed = {'Recommended', 'Advanced', 'Expert', 'Unsafe', 'System'}

          def grab(key):
              m = re.search(rf'^\s*{key}\s*:\s*(\S.*)$', body, re.MULTILINE)
              return m.group(1).strip() if m else ''

          pkg = grab('pkg')
          current = grab('current')
          proposed = grab('proposed')

          why = ''
          m = re.search(r'##\s*为什么[^\n]*\n+(?:<!--.*?-->\s*)*```\s*\n(.*?)```', body, re.S)
          if m:
              why = m.group(1).strip()
          else:
              m = re.search(r'##\s*为什么[^\n]*\n+(.+?)(?=\n##|\Z)', body, re.S)
              if m:
                  why = re.sub(r'<!--.*?-->', '', m.group(1), flags=re.S).strip()

          errors = []
          if not re.fullmatch(r'[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)+', pkg or ''):
              errors.append(f'pkg 不是一个合法的包名：{pkg!r}')
          if proposed not in allowed:
              errors.append(f'proposed 不在档位里：{proposed!r}（只接受 {sorted(allowed)}）')
          if current and current not in allowed:
              errors.append(f'current 不在档位里：{current!r}')
          if len(why) < 8:
              errors.append(f'「为什么」太短或为空：{why!r}')

          def line(label):
              m = re.search(rf'^-\s*{label}\s*[:：]\s*(\S.*)$', body, re.MULTILINE)
              return m.group(1).strip() if m else ''
          device = ' / '.join(x for x in (line('机型'), line('ROM 与版本')) if x)

          if errors:
              print('::error::表单不合格：' + '；'.join(errors))
              sys.exit(1)

          out = {'pkg': pkg, 'current': current, 'proposed': proposed, 'why': why, 'device': device}
          json.dump(out, open('/tmp/parsed.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      # ---------------------------------------------------------------- 合并
      - name: 🧩 Merge into level_fixes.json
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          VOTE_ROWS: ${{ steps.votes.outputs.rows }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, datetime, sys

          path = os.environ['TARGET']
          data = json.load(open(path, encoding='utf-8'))
          packages = data.setdefault('packages', {})
          allowed = {'Recommended', 'Advanced', 'Expert', 'Unsafe', 'System'}
          published_ids = []

          # ---- 投票通过的（数据库那条腿）
          rows = json.loads(os.environ.get('VOTE_ROWS') or '[]')
          for row in rows:
              pkg = (row.get('pkg') or '').strip()
              removal = (row.get('removal') or '').strip()
              if not pkg or removal not in allowed:
                  print(f'::warning::跳过不合法的投票结果：{row}')
                  continue
              existing = packages.get(pkg)
              if existing and existing.get('source') == 'maintainer':
                  print(f'::warning::{pkg} 是我们自己写下的一条，投票结果不覆盖它')
                  continue
              notes = row.get('notes') or {}
              if isinstance(notes, str):
                  notes = {'zh': notes, 'en': notes}
              packages[pkg] = {
                  'removal': removal,
                  'source': 'community',
                  'issue': 0,
                  'notes': notes,
              }
              if row.get('id'):
                  published_ids.append(int(row['id']))
              print(f'merged by vote: {pkg} -> {removal}')

          # ---- issue 那条腿
          if os.path.exists('/tmp/parsed.json'):
              entry_in = json.load(open('/tmp/parsed.json', encoding='utf-8'))
              pkg = entry_in['pkg']
              existing = packages.get(pkg)
              if existing and existing.get('source') == 'maintainer':
                  sys.exit(f'{pkg} 是我们自己写下的一条（source=maintainer），工作流不动它。')
              issue = int(os.environ.get('ISSUE') or 0)
              who = entry_in.get('device') or 'user report'
              note = f"{entry_in['why']}（依据：issue #{issue}，{who}）"
              packages[pkg] = {
                  'removal': entry_in['proposed'],
                  'source': 'community',
                  'issue': issue,
                  'notes': {'zh': note, 'en': note},
              }
              print(f'merged by issue: {pkg} -> {entry_in["proposed"]}')

          data['version'] = int(data.get('version', 1)) + 1
          data['updated'] = datetime.date.today().isoformat()
          json.dump(data, open(path, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          open(path, 'a', encoding='utf-8').write('\n')
          if published_ids:
              open('/tmp/published_ids.json', 'w').write(json.dumps(published_ids))
          PY

      - name: 🚀 Commit & push
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo "修正表没变化，不提交。"
            exit 0
          fi
          git commit -m "fix(bloat): 合并级别修正（投票通过的与 issue 确认的）"
          git push origin HEAD:master

      - name: ✅ Mark them published
        if: ${{ !inputs.dry_run && hashFiles('/tmp/published_ids.json') != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: axuhfogeovtsbxokqccf
        run: |
          set -euo pipefail
          IDS=$(cat /tmp/published_ids.json)
          SQL="select public.level_fix_mark_published('$IDS'::bigint[]) as marked"
          jq -Rs '{query: .}' <<< "$SQL" | curl -fsS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @-
          echo "marked published: $IDS"

      - name: 💬 Tell the reporter
        if: always() && github.event.issue.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            BODY='这条修正已合并进 `site/bloat/level_fixes.json`，所有手机在下一次核对（一周内）就会拿到新档位，不需要等发版。谢谢。'
          else
            BODY='这条修正没有合并成功，原因见上面的 Actions 日志（通常是包名、档位或「为什么」不合格）。改好之后请维护者重新打 `level-fix-confirm` 标签。'
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" -f body="$BODY" > /dev/null