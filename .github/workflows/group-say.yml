name: 💬 Group say

# 以「群聊AI」（sender = 'ai'）的身份，往某个群发一条纯文本消息。
#
# 为什么要有它：写一条 sender='ai' 的群消息没有对外的 RPC（`message_send` 只认客户端身份，
# `apply_ai_reply` 只处理 ai_jobs），而本机到 api.supabase.com 又不通 —— 所以只有 CI 这条线。
# 发版公告走 `group-release-notice.yml`（workflow_call）；这里是「问题已修复」这类一次性回帖，
# 手工 dispatch。仓库是 public，凭据只从 secrets 取。
#
# 用法：
#   gh workflow run group-say.yml -f conversation_id=18 -f body='已修复，更新到最新开发版再试'
#   gh run list --workflow group-say.yml --limit 1

on:
  workflow_dispatch:
    inputs:
      conversation_id:
        description: "群号（18 = Bug 反馈，12 = 内测灰度）"
        type: string
        default: "18"
      sender_name:
        description: "显示名"
        type: string
        default: "群聊AI"
      body:
        description: "正文（纯文本，可带换行；不要包含 $body$）"
        type: string
        required: true

permissions:
  contents: read

jobs:
  post:
    name: Post as 群聊AI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Post the message
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: axuhfogeovtsbxokqccf
          CONVERSATION_ID: ${{ inputs.conversation_id }}
          SENDER_NAME: ${{ inputs.sender_name }}
          BODY: ${{ inputs.body }}
        run: |
          set -euo pipefail
          case "$CONVERSATION_ID" in
            ''|*[!0-9]*) echo "conversation_id 必须是数字（收到 '$CONVERSATION_ID'）" >&2; exit 1 ;;
          esac
          if [ -z "$BODY" ]; then echo "body 不能为空" >&2; exit 1; fi
          # 正文和显示名都走 dollar-quoting 原样塞进 SQL，别让引号参与拼接。
          printf '%s' "$BODY" > body.txt
          SQL='with g as (
                 select c.id from public.conversations c
                  where c.id = '"$CONVERSATION_ID"'::bigint and c.kind = $$group$$
               ), ins as (
                 insert into public.messages (conversation_id, sender, sender_name, body, kind)
                 select g.id, $$ai$$, $name$'"$SENDER_NAME"'$name$, $body$'"$(cat body.txt)"'$body$, $$text$$ from g
                 returning id, conversation_id, created_at
               ), upd as (
                 update public.conversations c set last_message_at = ins.created_at
                   from ins where c.id = ins.conversation_id
                 returning c.id
               )
               select ins.id as message_id, ins.conversation_id as conversation_id, ins.created_at
                 from ins join upd on upd.id = ins.conversation_id'
          RESP=$(curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$SQL" '{query: $q}')")
          echo "$RESP"
          echo "$RESP" | jq -e 'length >= 1 and .[0].message_id != null' > /dev/null || {
            echo "群 $CONVERSATION_ID 没匹配到，什么都没发出去" >&2
            exit 1
          }
