name: 🏗️ Push Build

# Push build: tests, debug APK and (when the signing secret is configured)
# the release APK. All compilation happens here in GitHub Actions — local
# builds are not supported, so this is the only place a build is produced.
#
# Tests, debug and release run as three parallel jobs after the test job, so
# the runners compile concurrently instead of serially; the Gradle build cache
# (org.gradle.caching) lets the two APK jobs reuse the compilation done here.

on:
  push:
  workflow_dispatch:

concurrency:
  group: push-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🧪 Run the test suite
        run: ./gradlew :composeApp:desktopTest :packages:desktopTest --stacktrace --no-daemon

      - name: 📤 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

  apkDebug:
    name: 🤖 Debug APK
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🏗️ Assemble debug
        run: ./gradlew :androidApp:assembleDebug --stacktrace --no-daemon

      - name: 📝 Checksums and package name
        run: |
          cd androidApp/build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump badging *.apk | head -1

      - name: 📦 Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: androidApp/build/outputs/apk/debug/
          retention-days: 14

  apkRelease:
    name: 📦 Release APK
    # Only when the signing secret is configured. The check happens inside the
    # job (steps skip themselves), so the workflow itself stays valid without it.
    #
    # Master already gets a signed APK from 🧪 Development APK on every push, so building one here
    # too compiled the same release twice per push. A manual dispatch still wants it.
    if: github.ref != 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: 🔍 Check whether the keystore secret is configured
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CANTA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::CANTA_KEYSTORE_BASE64 is not set; the release APK steps are skipped"
          fi

      - name: 🔐 Write the keystore (stable, so builds upgrade each other)
        if: steps.keystore.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CANTA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: 📝 Write key.properties
        if: steps.keystore.outputs.configured == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/key.properties"

      - name: 🔧 Make gradlew executable
        if: steps.keystore.outputs.configured == 'true'
        run: chmod +x gradlew

      - name: 🏗️ Assemble release (R8 + resource shrinking)
        if: steps.keystore.outputs.configured == 'true'
        run: ./gradlew :androidApp:assembleRelease --stacktrace --no-daemon

      - name: 📝 Checksums, sizes and the package name the APK really has
        if: steps.keystore.outputs.configured == 'true'
        run: |
          cd androidApp/build/outputs/apk/release
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -l --block-size=K *.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump badging *.apk | head -1

      - name: 📦 Upload release APK
        if: steps.keystore.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: androidApp/build/outputs/apk/release/
          retention-days: 14
