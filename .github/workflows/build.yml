name: 🏗️ Push Build

# Single job: tests, debug APK and (when the signing secret is configured)
# the release APK. All compilation happens here in GitHub Actions — local
# builds are not supported, so this is the only place a build is produced.
#
# Everything runs in one job so the Gradle build directory and daemon are
# shared between the test and assemble tasks: one cold compilation instead of
# several, and no cross-job cache miss.

on:
  push:
  workflow_dispatch:

concurrency:
  group: push-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  build:
    name: 🏗️ Test + APK
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🔍 Check whether the keystore secret is configured
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CANTA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::CANTA_KEYSTORE_BASE64 is not set; the release APK steps are skipped"
          fi

      - name: 🔐 Write the keystore (stable, so builds upgrade each other)
        if: steps.keystore.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CANTA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: 📝 Write key.properties
        if: steps.keystore.outputs.configured == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/key.properties"

      # Tests and the APK builds share one Gradle invocation, so the compile
      # output produced for the tests is reused by the assemble tasks.
      - name: 🧪 Test + 🏗️ Build
        run: |
          ./gradlew :composeApp:desktopTest :packages:desktopTest \
            :androidApp:assembleDebug :desktopApp:desktopJar \
            :webApp:wasmJsBrowserDistribution --stacktrace
          if [ "${{ steps.keystore.outputs.configured }}" = "true" ]; then
            ./gradlew :androidApp:assembleRelease --stacktrace
          fi

      - name: 📝 Checksums and package name
        run: |
          cd androidApp/build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump badging *.apk | head -1

      - name: 📤 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

      - name: 📦 Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: androidApp/build/outputs/apk/debug/
          retention-days: 14

      - name: 📦 Upload release APK
        if: steps.keystore.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: androidApp/build/outputs/apk/release/
          retention-days: 14
