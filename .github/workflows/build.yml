name: 🏗️ Push Build

# Every push triggers the full build: tests, debug APK and (when the keystore
# secret is configured) the release APK. All compilation happens here in
# GitHub Actions — local builds are not supported, so this is the only place a
# build is produced.

on:
  push:
  workflow_dispatch:

concurrency:
  group: push-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🧪 Run the test suite
        run: ./gradlew :composeApp:desktopTest --stacktrace --no-daemon

      - name: 📤 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

  apkDebug:
    name: 🤖 Debug APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🏗️ Assemble debug
        run: ./gradlew :androidApp:assembleDebug --stacktrace --no-daemon

      - name: 📝 Checksums and package name
        run: |
          cd androidApp/build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump badging *.apk | head -1

      - name: 📦 Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: androidApp/build/outputs/apk/debug/
          retention-days: 14

  apkRelease:
    name: 📦 Release APK
    # Only when the signing secret is configured; the release needs the keystore,
    # so a fork without it skips this job and still gets tests + debug APK.
    if: ${{ secrets.CANTA_KEYSTORE_BASE64 != '' }}
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: 🔐 Write the keystore (stable, so builds upgrade each other)
        env:
          KEYSTORE_BASE64: ${{ secrets.CANTA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: 📝 Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/key.properties"

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🏗️ Assemble release (R8 + resource shrinking)
        run: ./gradlew :androidApp:assembleRelease --stacktrace --no-daemon

      - name: 📝 Checksums, sizes and the package name the APK really has
        run: |
          cd androidApp/build/outputs/apk/release
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -l --block-size=K *.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump badging *.apk | head -1

      - name: 📦 Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: androidApp/build/outputs/apk/release/
          retention-days: 14
