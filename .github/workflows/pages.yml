name: 🌐 Deploy download page

# 公开仓库后，Release 资产本身就能被任何人直接下载，
# 所以这里只负责把 site/ 的静态页面发布到 GitHub Pages。
#
# 发布方式：把生成好的 _site 推到 gh-pages 分支，由 GitHub 做分支部署。
# 不用 deploy-pages@v4：那条链路要 pages: write + github-pages environment，
# 在这个仓库上会卡在 deploy 阶段；分支部署只依赖 contents: write，最稳。
#
# 站点地址：https://303562915.github.io/unicanta/

on:
  release:
    types: [published]
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["🧪 Development APK"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "要展示的 tag（留空 = 最新 release）"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  REPO: 303562915/unicanta

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check development publication
        id: development_publication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != workflow_run ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.name == "Build and publish signed development APK") | .steps[] | select(.name == "Publish rolling prerelease" and .conclusion == "success") | .name')
            if [ "$jobs" = 'Publish rolling prerelease' ]; then
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "Development publication was skipped."
            fi
          fi

      - name: ⬇️ Checkout
        if: steps.development_publication.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: 🏷️ Resolve release
        if: steps.development_publication.outputs.proceed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if [ "$TAG" = "dev" ]; then
            TAG=""
          fi

          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$REPO" --json tagName --jq '.tagName' 2>/dev/null || echo "")
          fi

          if [ -z "$TAG" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::仓库还没有 published release，本次只发布页面骨架"
            exit 0
          fi

          gh release view "$TAG" --repo "$REPO" \
            --json tagName,publishedAt,body,assets > release.json

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "解析到 $TAG"
          cat release.json

      - name: Resolve development release
        if: steps.development_publication.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/releases?per_page=100" > releases.json
          python3 - <<'PY'
          import json, pathlib
          releases = json.loads(pathlib.Path('releases.json').read_text(encoding='utf-8'))
          matches = [release for page in releases for release in page if release['tag_name'] == 'dev' and not release['draft']]
          if len(matches) > 1:
              raise SystemExit('Multiple dev releases found')
          pathlib.Path('development-release.json').write_text(json.dumps(matches[0] if matches else None), encoding='utf-8')
          PY

      - name: 🧬 Assemble site
        if: steps.development_publication.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ env.REPO }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/
          : > _site/.nojekyll

          if [ "${{ steps.release.outputs.found }}" = "true" ]; then
            TAG=$(python3 -c "import json;print(json.load(open('release.json'))['tagName'])")
            export TAG
            VERSION_CODE=$(gh api "repos/$REPO/contents/gradle.properties" -f "ref=$TAG" --method GET --jq .content | base64 -d | grep '^version_code=' | cut -d'=' -f2)
            export VERSION_CODE

            # 校验和文件是可选的，取不到就留空
            if gh release download "$TAG" --repo "$REPO" \
                 --pattern 'SHA256SUMS.txt' --dir . --clobber; then
              echo "已取得 SHA256SUMS.txt"
            fi

            python3 - <<'PY'
          import json, os, pathlib

          import re

          BOILER = ('- 下载页：', '- 包名：', '下载页：', '包名：', '校验和')

          def clean_notes(text):
              """发布脚本写的样板行不带信息量，日志里只保留真正的更新内容。"""
              keep = []
              for line in (text or '').splitlines():
                  s = line.strip()
                  if not s or s.startswith(BOILER) or re.fullmatch(r'Canta \d+(\.\d+)*', s):
                      continue
                  keep.append(line.rstrip())
              return '\n'.join(keep).strip()

          repo = os.environ["REPO"]
          rel = json.loads(pathlib.Path("release.json").read_text(encoding="utf-8"))
          tag = rel["tagName"]
          version = tag[1:] if tag.startswith("v") else tag

          assets = [a for a in rel.get("assets", []) if a["name"].lower().endswith(".apk")]
          if not assets:
              raise SystemExit("release 中没有 APK 资产")

          apk = assets[0]
          sums = next((a for a in rel.get("assets", []) if a["name"] == "SHA256SUMS.txt"), None)

          digest = ""
          sums_path = pathlib.Path("SHA256SUMS.txt")
          if sums and sums_path.exists():
              for line in sums_path.read_text(encoding="utf-8", errors="ignore").splitlines():
                  parts = line.split()
                  if len(parts) >= 2 and parts[-1].lstrip("*") == apk["name"]:
                      digest = parts[0]
                      break

          base = f"https://github.com/{repo}/releases/download/{tag}"
          entry = {
              "version_name": version,
              "version_code": int(os.environ.get("VERSION_CODE") or 0),
              "tag": tag,
              "published_at": rel.get("publishedAt"),
              "file": f"{base}/{apk['name']}",
              "file_name": apk["name"],
              "size": apk.get("size", 0),
              "sha256": digest,
              "checksum_file": f"{base}/{sums['name']}" if sums else None,
              "notes": clean_notes(rel.get("body")),
          }

          # 近几个稳定版一起输出，页面可逐版本展开看日志。
          pages = json.loads(pathlib.Path("releases.json").read_text(encoding="utf-8"))
          releases_all = [r for page in pages for r in page]
          stable = [r for r in releases_all
                    if not r["draft"] and not r["prerelease"] and r["tag_name"].startswith("v")
                    and any(a["name"].lower().endswith(".apk") for a in r["assets"])]
          stable.sort(key=lambda r: r.get("published_at") or "", reverse=True)

          history = []
          for r in stable[:6]:
              r_tag = r["tag_name"]
              r_apk = next(a for a in r["assets"] if a["name"].lower().endswith(".apk"))
              r_sums = next((a for a in r["assets"] if a["name"] == "SHA256SUMS.txt"), None)
              history.append({
                  "version_name": r_tag[1:] if r_tag.startswith("v") else r_tag,
                  "version_code": entry["version_code"] if r_tag == tag else 0,
                  "tag": r_tag,
                  "published_at": r.get("published_at"),
                  "file": r_apk["browser_download_url"],
                  "file_name": r_apk["name"],
                  "size": r_apk.get("size", 0),
                  "sha256": entry["sha256"] if r_tag == tag else "",
                  "checksum_file": r_sums["browser_download_url"] if r_sums else None,
                  "notes": clean_notes(r.get("body")),
              })

          data = dict(entry)
          data["history"] = history
          pathlib.Path("_site/latest.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          else
            cat > _site/latest.json <<'JSON'
          {
            "version_name": null,
            "version_code": 0,
            "tag": null,
            "published_at": null,
            "file": null,
            "file_name": null,
            "size": 0,
            "sha256": "",
            "checksum_file": null,
            "notes": "",
            "history": []
          }
          JSON
          fi

          python3 - <<'PY'
          import json, os, pathlib, re, subprocess

          rel = json.loads(pathlib.Path('development-release.json').read_text(encoding='utf-8'))
          if rel is None or (rel.get('body') or '').strip() == 'Preparing the first development build.':
              data = {'version_name': None, 'version_code': 0, 'build_number': None, 'tag': None,
                      'published_at': None, 'file': None, 'file_name': None, 'size': 0,
                      'sha256': '', 'checksum_file': None, 'notes': '', 'history': []}
          else:
              body = rel.get('body') or ''
              def field(name, pattern):
                  matches = re.findall(rf'(?m)^{re.escape(name)}: ({pattern})\s*$', body)
                  if len(matches) != 1:
                      raise SystemExit(f'Invalid development release {name}')
                  return matches[0]
              version = field('version', r'[^\s]+')
              build = int(field('development-build', r'[1-9][0-9]*'))
              commit = field('Commit', r'[0-9a-fA-F]{40}')
              name = f'androidApp-release-{build}.apk'
              sums_name = f'SHA256SUMS-{build}.txt'
              assets = rel.get('assets', [])
              apks = [asset for asset in assets if asset['name'] == name]
              sums = [asset for asset in assets if asset['name'] == sums_name]
              if len(apks) != 1 or len(sums) != 1:
                  raise SystemExit('Development release must contain exactly one matching APK and checksum')
              subprocess.run(['gh', 'release', 'download', 'dev', '--repo', os.environ['REPO'],
                              '--pattern', sums_name, '--dir', '.', '--clobber'], check=True)
              lines = pathlib.Path(sums_name).read_text(encoding='utf-8').splitlines()
              digests = [parts[0] for line in lines if len(parts := line.split()) == 2
                         and parts[1].lstrip('*') == name and re.fullmatch(r'[0-9a-fA-F]{64}', parts[0])]
              if len(digests) != 1:
                  raise SystemExit('Invalid development APK checksum')
              props = subprocess.check_output(['gh', 'api', f"repos/{os.environ['REPO']}/contents/gradle.properties?ref={commit}",
                                               '--jq', '.content'], text=True)
              import base64
              codes = re.findall(r'(?m)^version_code=([0-9]+)\s*$', base64.b64decode(props).decode('utf-8'))
              if len(codes) != 1:
                  raise SystemExit('Invalid development version_code')
              apk, checksum = apks[0], sums[0]
              # 滚动 dev release 只创建一次，release 级 published_at 停在首发时刻；
              # 页面"更新于"要用当前 build APK 资产的上传时间。
              dev_notes = '\n'.join(ln for ln in body.splitlines()
                                    if ln.strip() and not ln.strip().startswith('Signed with'))
              dev_notes += f"\n提交：https://github.com/{os.environ['REPO']}/commit/{commit}"
              entry = {'version_name': version, 'version_code': int(codes[0]), 'build_number': build,
                       'tag': 'dev',
                       'published_at': apk.get('created_at') or apk.get('updated_at') or rel.get('published_at'),
                       'file': apk['browser_download_url'], 'file_name': name, 'size': apk.get('size', 0),
                       'sha256': digests[0], 'checksum_file': checksum['browser_download_url'],
                       'notes': dev_notes}
              # 滚动 release 里每个 build 都是一个资产，历史列表取最近 8 个。
              hist = []
              apk_assets = [a for a in assets if re.fullmatch(r'androidApp-release-[0-9]+\.apk', a['name'])]
              apk_assets.sort(key=lambda a: a.get('created_at') or '', reverse=True)
              for a in apk_assets[:8]:
                  b = int(re.fullmatch(r'androidApp-release-([0-9]+)\.apk', a['name']).group(1))
                  sums_b = next((s for s in assets if s['name'] == f'SHA256SUMS-{b}.txt'), None)
                  hist.append({'version_name': version, 'version_code': int(codes[0]), 'build_number': b,
                               'tag': 'dev', 'published_at': a.get('created_at'),
                               'file': a['browser_download_url'], 'file_name': a['name'],
                               'size': a.get('size', 0), 'sha256': digests[0] if b == build else '',
                               'checksum_file': sums_b['browser_download_url'] if sums_b else None,
                               'notes': dev_notes if b == build else ''})
              data = dict(entry, history=hist)
          pathlib.Path('_site/development.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          echo "--- _site ---"
          ls -la _site

      - name: 🚀 Push to gh-pages
        if: steps.development_publication.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: ${{ steps.release.outputs.tag || 'skeleton' }}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages

      - name: 🧾 Summary
        if: steps.development_publication.outputs.proceed == 'true'
        run: |
          {
            echo "### 已发布 ${{ steps.release.outputs.tag || '（无 release，仅骨架）' }}"
            echo ""
            echo "- 站点：https://303562915.github.io/unicanta/"
            echo "- 分支：gh-pages"
          } >> "$GITHUB_STEP_SUMMARY"
