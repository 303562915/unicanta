name: Deploy Documentation

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
  release:
    types: [published]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      wasm_ref:
        description: "Git ref (tag/branch/SHA) to build WASM from. Empty = latest v* tag."
        default: ""
        required: false

# 注意：GitHub Pages 的发布者是 pages.yml（下载页）。
# 同一个仓库只能有一个 Pages 站点，两套工作流同时 deploy-pages 会互相覆盖，
# 所以这里只做「文档站能否构建成功」的验证，不再上传/部署。
# 等文档站要真正上线时，把它的产物并入 pages.yml 的 _site/（例如挂到 /docs/ 子路径）。
permissions:
  contents: read

# 只约束本工作流自身，避免和 pages.yml 抢同一个 concurrency group
concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout docs (current ref)
        uses: actions/checkout@v4
        with:
          path: repo-docs
          fetch-depth: 0

      - name: Checkout WASM source (latest v* tag or wasm_ref input)
        uses: actions/checkout@v4
        with:
          path: repo-wasm
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.wasm_ref != '' && inputs.wasm_ref || github.event.release.tag_name || '' }}

      - name: Resolve latest v* tag (when no explicit ref)
        if: inputs.wasm_ref == '' && github.event_name != 'release'
        run: |
          cd repo-wasm
          git fetch --tags --force
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No v* tag found, staying on default branch"
          else
            echo "Checking out $LATEST_TAG"
            git checkout "$LATEST_TAG"
          fi
          git rev-parse HEAD

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build WASM from tag source
        run: |
          chmod +x gradlew
          # Give the wrapper a longer timeout than the 10 s default
          grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties \
            || printf '\nnetworkTimeout=120000\n' >> gradle/wrapper/gradle-wrapper.properties
          # Download the distribution with retries (handles slow GitHub release CDN)
          for i in 1 2 3 4 5; do
            ./gradlew --version --no-daemon && break
            echo "Gradle wrapper download failed (attempt $i), retrying in $((i*15))s..."
            sleep $((i*15))
          done
          ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon
        working-directory: repo-wasm

      - name: Build full site (tagged WASM + current docs)
        run: |
          WASM_DIST="$GITHUB_WORKSPACE/repo-wasm/webApp/build/dist/wasmJs/productionExecutable"
          if [ ! -d "$WASM_DIST" ]; then
            echo "WASM dist not found: $WASM_DIST"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/wasm-dist"
          cp -r "$WASM_DIST/." "$GITHUB_WORKSPACE/wasm-dist/"
          # Point the docs build script at the prebuilt dist by overlaying it
          # onto the expected location under repo-docs.
          mkdir -p webApp/build/dist/wasmJs
          cp -r "$GITHUB_WORKSPACE/wasm-dist" webApp/build/dist/wasmJs/productionExecutable
          cd docs
          npm install --no-audit --no-fund
          npm run site:build:no-wasm
        working-directory: repo-docs

      # 只是把构建产物存下来证明"文档站能编出来"，不部署到 Pages
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: repo-docs/docs/.vitepress/dist
          retention-days: 7

