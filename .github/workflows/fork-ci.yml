name: 🔧 Fork CI — tests + debug APK

# Runs on every branch of the fork, so the fork can validate changes without
# waiting for upstream (upstream's PR check only triggers on PRs against master).
on:
  push:
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Common tests
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🧪 Tests for the changed utilities first
        run: |
          ./gradlew :composeApp:desktopTest \
            --tests "io.github.samolego.canta.util.*" \
            --stacktrace --no-daemon

      - name: 🧪 Full desktop test suite
        run: ./gradlew :composeApp:desktopTest --stacktrace --no-daemon

      - name: 📤 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

  apk:
    name: 🤖 Debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🏗️ Assemble debug
        run: ./gradlew :androidApp:assembleDebug --stacktrace --no-daemon

      - name: 📝 Checksums
        run: |
          cd androidApp/build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: androidApp/build/outputs/apk/debug/
          retention-days: 14

  release:
    name: 📦 Minified release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: 🔐 Write the keystore (stable, so builds upgrade each other)
        env:
          KEYSTORE_BASE64: ${{ secrets.CANTA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: 📝 Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/key.properties"

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🏗️ Assemble release (R8 + resource shrinking)
        run: ./gradlew :androidApp:assembleRelease --stacktrace --no-daemon

      - name: 📝 Checksums and sizes
        run: |
          cd androidApp/build/outputs/apk/release
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -l --block-size=K *.apk

      - name: 📦 Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: androidApp/build/outputs/apk/release/
          retention-days: 14
