name: 🔎 Supabase log probe

# 一次性诊断入口：给「App 里什么都没有」这类问题取后端日志 / 查库用。只读。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Supabase project ref
        required: false
        default: axuhfogeovtsbxokqccf

jobs:
  probe:
    name: 🧾 probe
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.ref }}
    steps:
      - name: Logs by source
        run: |
          set +e
          B="https://api.supabase.com/v1/projects/${PROJECT_REF}/analytics/endpoints/logs"
          show() { echo "### $1"; echo "http: $(cat /tmp/code)"; head -c 3000 /tmp/out; echo; echo; }
          try() {
            shift 2>/dev/null
            curl -sS -m 90 -o /tmp/out -w '%{http_code}' -G "$B" "$@" -H "Authorization: Bearer ${TOKEN}" > /tmp/code 2>/dev/null
          }
          try x --data-urlencode "source=postgres_logs" --data-urlencode "sql=select timestamp, event_message from postgres_logs order by timestamp desc limit 15"
          show "A source=postgres_logs + sql"
          try x --data-urlencode "source=postgres_logs"
          show "B source=postgres_logs only"
          try x --data-urlencode "source=postgrest_logs" --data-urlencode "sql=select timestamp, event_message from postgrest_logs order by timestamp desc limit 15"
          show "C source=postgrest_logs + sql"

      - name: Query database
        run: |
          set +e
          Q() {
            echo "### $1"
            curl -sS -m 90 -o /tmp/o -w 'http:%{http_code}\n' -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              --data "$(printf '{\"query\":%s}' "$(printf '%s' "$2" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")"
            head -c 3000 /tmp/o; echo; echo
          }
          Q "users" "select count(*) as users, max(created_at) as last_user from public.canta_users"
          Q "plans" "select count(*) as plans, max(created_at) as last_plan from public.plans"
          Q "comments" "select count(*) as comments, max(created_at) as last_comment from public.community_comments"
          Q "messages" "select count(*) as messages, max(created_at) as last_message from public.messages"
