name: 🔎 Supabase log probe

# 只读诊断入口：从 Supabase 管理 API 取最近一段时间的后端日志。
#
# 用法要点（新端点，老 `logs.all` 已下线）：
#   * `POST /v1/projects/{ref}/analytics/endpoints/logs`
#   * body 只认 `sql` / `lql` / `iso_timestamp_start` / `iso_timestamp_end`
#   * **必须给时间窗**（≤24h，按分钟取整），不给只查最近 1 分钟
#   * SQL 是 ClickHouse 方言，单张 `logs` 表，用 `where source='…'` 过滤
#
# 典型问题：App 里页面全空 → 跑一次 postgrest_logs，看有没有请求、状态码是什么。

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 往回看多少分钟（1–1440）
        required: false
        default: "15"
      source:
        description: 日志来源
        required: false
        type: choice
        default: postgrest_logs
        options:
          - postgrest_logs
          - postgres_logs
          - pgbouncer_logs
          - edge_logs
          - storage_logs
          - realtime_logs

jobs:
  probe:
    name: 🧾 logs
    runs-on: ubuntu-latest
    steps:
      - name: Query logs
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SOURCE: ${{ inputs.source }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          set -euo pipefail
          REF=axuhfogeovtsbxokqccf
          END=$(date -u +%Y-%m-%dT%H:%M:00Z)
          START=$(date -u -d "-${MINUTES} minutes" +%Y-%m-%dT%H:%M:00Z)
          SQL="select timestamp, event_message from logs where source='${SOURCE}' order by timestamp desc limit 50"
          echo "window: ${START} .. ${END}"
          echo "source: ${SOURCE}"
          PAYLOAD=$(SQL="$SQL" START="$START" END="$END" python3 -c \
            'import json,os; print(json.dumps({"sql":os.environ["SQL"],"iso_timestamp_start":os.environ["START"],"iso_timestamp_end":os.environ["END"]}))')
          echo "--- response ---"
          curl -sS -m 90 -X POST "https://api.supabase.com/v1/projects/${REF}/analytics/endpoints/logs" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            --data "$PAYLOAD" -w '\nhttp:%{http_code}\n' | head -c 60000
