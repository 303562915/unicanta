name: 🔎 Supabase log probe

# 一次性的诊断入口：给「App 里什么都没有」这类问题取后端日志用。
# 只读，不改任何数据；跑完可以删掉这个文件。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Supabase project ref
        required: false
        default: axuhfogeovtsbxokqccf

jobs:
  probe:
    name: 🧾 logs
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.ref }}
    steps:
      - name: Probe endpoint variants
        run: |
          set +e
          B="https://api.supabase.com/v1/projects/${PROJECT_REF}/analytics/endpoints/logs"

          show() {
            echo "### $1"
            echo "http: $(cat /tmp/code)"
            head -c 4000 /tmp/out
            echo
            echo
          }

          run_sql() {
            curl -sS -m 90 -o /tmp/out -w '%{http_code}' -G "$B" \
              --data-urlencode "sql=$1" \
              -H "Authorization: Bearer ${TOKEN}" > /tmp/code 2>/tmp/err
            show "$2"
          }

          run_sql "select timestamp, source, event_message from logs order by timestamp desc limit 20" "A: unified logs table"
          run_sql "select timestamp, event_message from postgres_logs order by timestamp desc limit 20" "B: postgres_logs"
          run_sql "select timestamp, event_message from edge_logs order by timestamp desc limit 20" "C: edge_logs"
          run_sql "select 1 as ok" "D: trivial select"
