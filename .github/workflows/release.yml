name: 📦🚀 Build & publish Android release

# 两条入口，都不需要点第二步：
#   - 推 v* tag：自动构建、自动发布、页面自动更新（正常发版走这条）
#   - 手动触发：可选择只建 draft，用来预演或补发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      keep_draft:
        description: "只建 draft，先不发布"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  deployAndroid:
    permissions: write-all
    name: 🤖📦🚀 Build & prepare Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # notify 用这两个输出：真的建出来并发出去的 tag 与版本号。
    outputs:
      tag: ${{ steps.extract_version.outputs.tag }}
      version_name: ${{ steps.extract_version.outputs.version_name }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21.x"
          cache: "gradle"
          distribution: "temurin"

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🔐 Retrieve base64 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CANTA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/android-keystore.jks"

      - name: 📝🔐 Create key.properties file
        env:
          KEYSTORE_PROPERTIES_PATH: ${{ github.workspace }}/key.properties
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "storeFile=${{ github.workspace }}/android-keystore.jks" > $KEYSTORE_PROPERTIES_PATH
          echo "keyAlias=$KEY_ALIAS" >> $KEYSTORE_PROPERTIES_PATH
          echo "storePassword=$KEYSTORE_PASSWORD" >> $KEYSTORE_PROPERTIES_PATH
          echo "keyPassword=$KEY_PASSWORD" >> $KEYSTORE_PROPERTIES_PATH

      - name: 📌 Extract version_name from gradle.properties
        id: extract_version
        run: |
          version=$(grep "^version_name=" gradle.properties | cut -d'=' -f2)
          echo "VERSION_NAME=$version" >> $GITHUB_ENV
          # A tag push names the release: gradle.properties may already be on the next version by
          # the time the tag is pushed, and publishing v4.3.1 from a v4.3.0 tag would be wrong.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "version_name=$version" >> $GITHUB_OUTPUT

      - name: 📝 Write release notes
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 变更清单的起点：上一个已发布的稳定版 tag；取不到就退回全部历史。
          PREV=$(gh release list --exclude-drafts --limit 30 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease == false and (.tagName | startswith("v")))][0].tagName // empty' || true)
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            RANGE="$PREV..HEAD"
          else
            RANGE="HEAD"
          fi
          echo "changelog range: $RANGE"

          {
            echo "Canta $VERSION_NAME"
            echo ""
            echo "更新内容："
            git log --no-merges --pretty='- %s (%h)' $RANGE | head -n 100
            echo ""
            echo "下载页：https://303562915.github.io/unicanta/"
            echo "包名：io.github.a303562915.unicanta"
            echo "校验和：见本 Release 的 SHA256SUMS.txt"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 🤖📦 Build Android APKs
        run: ./gradlew :androidApp:assembleRelease

      - name: 📝 Generate SHA-256 checksums
        run: |
          cd androidApp/build/outputs/apk/release/
          sha256sum *.apk > SHA256SUMS.txt

      - name: "Echo SHA-256 sums"
        run: cat androidApp/build/outputs/apk/release/SHA256SUMS.txt

      - name: 🔧 Setup GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh config set prompt disabled

      - name: 🛡️ Generate artifact attestation
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'androidApp/build/outputs/apk/release/*.apk'

      - name: 📦 Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.extract_version.outputs.tag }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEEP_DRAFT: ${{ inputs.keep_draft }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # A tag push already created the ref, so --target would be rejected there.
          TARGET_ARGS=()
          if [ "$REF_TYPE" != "tag" ]; then
            TARGET_ARGS=(--target "$GITHUB_SHA")
          fi

          DRAFT_ARGS=()
          if [ "$KEEP_DRAFT" = "true" ]; then
            DRAFT_ARGS=(--draft)
          fi

          gh release create "$TAG" \
            --title "Canta $VERSION_NAME" \
            --notes-file RELEASE_NOTES.md \
            "${DRAFT_ARGS[@]}" \
            "${TARGET_ARGS[@]}"

      - name: 📁 Upload APKs, checksums & attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.extract_version.outputs.tag }}
        run: |
          gh release upload "$TAG" androidApp/build/outputs/apk/release/*.apk
          gh release upload "$TAG" androidApp/build/outputs/apk/release/SHA256SUMS.txt
          gh release upload "$TAG" "${{ steps.attest.outputs.bundle-path }}"

      - name: 🖼️ Mirror stable APK to the image bed
        # 国内下载走图床：传一份到 `unicanta/apk/stable-<版本>.apk`。`pages.yml` 会先探测这个对象，
        # 读得到才把它的地址写进 `latest.json` 的 `file_bed`，客户端因此优先从图床取包、取不到再回 GitHub。
        # 失败不阻断发布：图床只是镜像，GitHub releases 上的直链才是权威产物。
        if: inputs.keep_draft != true
        env:
          TAG: ${{ steps.extract_version.outputs.tag }}
        run: |
          set -uo pipefail
          SRC=composeApp/src/commonMain/kotlin/io/github/samolego/canta/data/imagebed/ImageBed.kt
          BASE_URL=$(sed -n 's/.*const val BASE_URL = "\([^"]*\)".*/\1/p' "$SRC")
          TOKEN=$(sed -n 's/.*const val TOKEN = "\([^"]*\)".*/\1/p' "$SRC")
          ROOT_DIR=$(sed -n 's/.*const val ROOT = "\([^"]*\)".*/\1/p' "$SRC")
          if [ -z "$BASE_URL" ] || [ -z "$TOKEN" ] || [ -z "$ROOT_DIR" ]; then
            echo "::warning::image bed mirror skipped: BASE_URL / TOKEN / ROOT not found"
            exit 0
          fi
          APK=$(ls androidApp/build/outputs/apk/release/*.apk | head -n1)
          FOLDER="${ROOT_DIR}/apk"
          # 版本号取自 tag（`v4.3.0` → `stable-4.3.0.apk`），和 pages.yml 探测的那个名字必须一致。
          NAME="stable-${TAG#v}.apk"
          RESP=$(curl -sS --fail-with-body --max-time 600 -X POST "$BASE_URL/api/upload" \
            -F "file=@${APK};type=application/vnd.android.package-archive;filename=${NAME}" \
            -F "uid=${TOKEN}" \
            -F "fileName=${NAME}" \
            -F "folder=${FOLDER}" \
            -F "overwrite=1" || true)
          echo "$RESP"
          URL=$(printf '%s' "$RESP" | jq -r '.url // empty' 2>/dev/null)
          if [ -z "$URL" ]; then
            echo "::warning::image bed mirror failed for $APK — clients will download from GitHub"
            exit 0
          fi
          EXPECT=$(sha256sum "$APK" | cut -d' ' -f1)
          if curl -sS -o /tmp/mirror.apk --fail --max-time 300 "$URL" \
             && [ "$(sha256sum /tmp/mirror.apk | cut -d' ' -f1)" = "$EXPECT" ]; then
            echo "mirrored: $URL"
          else
            echo "::warning::image bed copy does not match $APK (size/sha256 mismatch or unreadable) — clients will download from GitHub"
          fi

      - name: 🌐 Update download page and announce
        if: inputs.keep_draft != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 为什么是显式 dispatch 而不是等 `release: published`：上面建 release 用的是 GITHUB_TOKEN，
        # GitHub 的递归保护让这个 token 产生的事件**不会**触发其它 workflow —— 实测 v4.3.6 那次
        # pages.yml 的 100 条历史 run 里一条 release 事件都没有，于是通知从来没发出去过。
        # 所以这里自己把 pages.yml 派起来，并把 announce 打开：钉钉与群公告由它在部署完成后发，
        # 那才是「下载页已经是这一版」的时刻。
        run: gh workflow run pages.yml --ref master -f announce=true

  # 钉钉与群公告**不在这里**：正式版 publish 会触发 pages.yml（release: published），由它在把
  # gh-pages 推上去之后发（见那边的 notify / notify-group）。从这里发会在下载页更新前就发出去。

