name: 📦🚀 Build & prepare draft Android release

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  deployAndroid:
    permissions: write-all
    name: 🤖📦🚀 Build & prepare Android release
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21.x"
          cache: "gradle"
          distribution: "temurin"

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🔐 Retrieve base64 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CANTA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/android-keystore.jks"

      - name: 📝🔐 Create key.properties file
        env:
          KEYSTORE_PROPERTIES_PATH: ${{ github.workspace }}/key.properties
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "storeFile=${{ github.workspace }}/android-keystore.jks" > $KEYSTORE_PROPERTIES_PATH
          echo "keyAlias=$KEY_ALIAS" >> $KEYSTORE_PROPERTIES_PATH
          echo "storePassword=$KEYSTORE_PASSWORD" >> $KEYSTORE_PROPERTIES_PATH
          echo "keyPassword=$KEY_PASSWORD" >> $KEYSTORE_PROPERTIES_PATH

      - name: 📌 Extract version_name from gradle.properties
        id: extract_version
        run: |
          version=$(grep "^version_name=" gradle.properties | cut -d'=' -f2)
          echo "VERSION_NAME=$version" >> $GITHUB_ENV
          echo "tag=v$version" >> $GITHUB_OUTPUT

      - name: 🤖📦 Build Android APKs
        run: ./gradlew :androidApp:assembleRelease

      - name: 📝 Generate SHA-256 checksums
        run: |
          cd androidApp/build/outputs/apk/release/
          sha256sum *.apk > SHA256SUMS.txt

      - name: "Echo SHA-256 sums"
        run: cat androidApp/build/outputs/apk/release/SHA256SUMS.txt

      - name: 🔧 Setup GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh config set prompt disabled

      - name: 🛡️ Generate artifact attestation
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'androidApp/build/outputs/apk/release/*.apk'

      - name: 📦 Create GitHub release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.extract_version.outputs.tag }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "Canta $VERSION_NAME" \
            --notes "" \
            --target "$GITHUB_SHA"

      - name: 📁 Upload APKs, checksums & attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.extract_version.outputs.tag }}
        run: |
          gh release upload "$TAG" androidApp/build/outputs/apk/release/*.apk
          gh release upload "$TAG" androidApp/build/outputs/apk/release/SHA256SUMS.txt
          gh release upload "$TAG" "${{ steps.attest.outputs.bundle-path }}"
